services:
  # a. Servicio de Python: API en puerto 5006 interno y 5007 en el host, desde una imagen
  servicio_python:
    image: python:3.12-slim
    container_name: contenedor_python_parcial
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5007:5006"
    command: sh -c "pip install flask && python api_parcial.py"

  # b. Servicio que gestiona el archivo suma.php usando una imagen de PHP
  servicio_php_suma:
    image: php:8.4-cli
    container_name: contenedor_php_parcial
    working_dir: /app
    volumes:
      - .:/app
    command: ["php", "suma.php"]

  # c. Servicio de MySQL que expone BD y almacena datos en un volumen
  laravel_bd:
    image: mysql:8.0
    container_name: mysql_parcial
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - datos_mysql:/var/lib/mysql

  # d. Servicio de PHP (Laravel) conectado a la BD para ejecutar migraciones, usando la imagen
  laravel_app:
    image: laravel_parcial_img
    container_name: laravel_parcial
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - laravel_bd

volumes:
  datos_mysql: